<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tianyi Huang</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/glightbox/dist/css/glightbox.min.css">
    <script src="https://cdn.jsdelivr.net/npm/glightbox/dist/js/glightbox.min.js" defer></script>
    <script src="js/site.js" defer></script>
</head>
<body>
    <div class="page-shell">
        <header class="site-header" role="banner">
            <section class="brand-wrap" aria-label="Site identity">
                <h1 id="site-name">Tianyi Huang</h1>
                <p id="site-subtitle">PhD Student, National University of Singapore</p>
            </section>
            <nav class="tab-nav" aria-label="Main navigation">
                <button class="tab-button active" type="button" data-tab="about">About</button>
                <button class="tab-button" type="button" data-tab="publications">Publications</button>
                <button class="tab-button" type="button" data-tab="projects">Projects</button>
                <button class="tab-button" type="button" data-tab="misc">Misc</button>
                <button class="tab-button" type="button" data-tab="cv">CV</button>
            </nav>
        </header>

        <main class="tab-content" id="main-content" tabindex="-1">
            <section id="tab-about" class="tab-panel active" aria-label="About"></section>
            <section id="tab-publications" class="tab-panel" aria-label="Publications"></section>
            <section id="tab-projects" class="tab-panel" aria-label="Projects"></section>
            <section id="tab-misc" class="tab-panel" aria-label="Misc"></section>
            <section id="tab-cv" class="tab-panel" aria-label="CV"></section>
        </main>

        <footer class="site-footer" role="contentinfo">
            <p>Build by me with <span style="color: #88D4CC;">♥</span></p>
        </footer>
    </div>

</body>
</html>
