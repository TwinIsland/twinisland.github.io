<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Personal Website</title>
    <!-- Site metadata -->

    <link
      rel="preload"
      href="assets/fonts/poppins/Poppins-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="assets/fonts/poppins/Poppins-Bold.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <script src="js/theme.js"></script>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="css/travel-map.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/glightbox/dist/css/glightbox.min.css"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/glightbox/dist/js/glightbox.min.js"
      defer
    ></script>
    <!-- Runtime Markdown start -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/markdown-it@14.1.0/dist/markdown-it.min.js"
      defer
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"
      defer
    ></script>
    <script src="js/markdown-it-katex-bridge.js" defer></script>
    <!-- Runtime Markdown end -->
    <script src="js/travel-map.js" defer></script>
    <script src="js/site.js" defer></script>
  </head>

  <body class="site-loading">
    <div class="site-loader" id="site-loader" role="status" aria-live="polite">
      <span class="site-loader-mark" aria-hidden="true"></span>
      <span>Loading site…</span>
    </div>
    <noscript
      ><style>
        .site-loader {
          display: none;
        }
        .site-loading .page-shell {
          visibility: visible;
          opacity: 1;
        }
      </style></noscript
    >
    <div class="page-shell" aria-busy="true">
      <header class="site-header" role="banner">
        <section class="brand-wrap" aria-label="Site identity">
          <div class="brand-name">
            <a class="site-name-mark site-home-link" href="#about" hidden>
              <span class="name-mark-art"><img alt="" /></span>
            </a>
            <div class="brand-controls">
              <button
                class="badge-switch"
                type="button"
                aria-label="Switch header badge"
                title="Switch badge"
                hidden
                ><span aria-hidden="true"></span
              ></button>
              <button
                class="theme-toggle"
                type="button"
                aria-label="Dark mode"
                aria-pressed="false"
                hidden
                ><span aria-hidden="true"></span
              ></button>
            </div>
            <h1 id="site-name"
              ><a class="site-home-link" href="#about"
                ><!-- Site name -->Personal Website</a
              ></h1
            >
          </div>
          <a class="site-home-link mobile-site-name" href="#about"
            ><!-- Site name -->Personal Website</a
          >
        </section>
        <nav class="tab-nav" aria-label="Main navigation">
          <button
            class="tab-button active"
            type="button"
            aria-current="page"
            data-tab="about"
            >About</button
          >
          <button class="tab-button" type="button" data-tab="publications"
            >Publications</button
          >
          <button class="tab-button" type="button" data-tab="projects"
            >Projects</button
          >
          <button class="tab-button" type="button" data-tab="misc">Misc</button>
          <button class="tab-button" type="button" data-tab="blog">Blog</button>
        </nav>
      </header>

      <main class="tab-content" id="main-content" tabindex="-1">
        <section
          id="tab-about"
          class="tab-panel active"
          aria-label="About"
        ></section>
        <section
          id="tab-publications"
          class="tab-panel"
          aria-label="Publications"
        ></section>
        <section
          id="tab-projects"
          class="tab-panel"
          aria-label="Projects"
        ></section>
        <section id="tab-misc" class="tab-panel" aria-label="Misc"></section>
        <section id="tab-blog" class="tab-panel" aria-label="Blog"></section>
      </main>

      <footer class="site-footer" role="contentinfo">
        <a
          class="footer-github"
          hidden
          data-site-source
          aria-label="Website source on GitHub"
        >
          <img src="assets/icons/github.svg" width="18" height="18" alt="" />
        </a>
        <p
          >Design by me with
          <span class="footer-heart" role="img" aria-label="love"></span
        ></p>
        <p
          class="footer-build"
          data-build-preview
          style="
            color: #a51d2d;
            color: light-dark(#a51d2d, #ff858d);
            font-weight: 700;
          "
        >
          Development preview. View the built site in <a href="dist/">dist/</a>.
        </p>
      </footer>
    </div>
  </body>
</html>
